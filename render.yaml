services:
  - type: web
    name: cortexia-backend
    runtime: python
    rootDir: backend
    plan: standard # model Whisper + Vosk + Piper butuh RAM > 512 MB
    buildCommand: bash build.sh
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DB_NAME
        value: cortexia
      - key: MONGO_URL # URI MongoDB Atlas (mongodb+srv://...)
        sync: false
      - key: CORS_ORIGINS # URL frontend, mis. https://cortexia-frontend.onrender.com
        sync: false

  - type: web
    name: cortexia-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: REACT_APP_BACKEND_URL # URL backend, mis. https://cortexia-backend.onrender.com
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

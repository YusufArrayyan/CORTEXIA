# Deploy sederhana: hanya frontend statis ke GitHub Pages (https://<user>.github.io/CORTEXIA/).
# Backend (FastAPI, Whisper, Vosk, MongoDB) tidak berjalan di GitHub Pages; fitur yang butuh API tidak berfungsi
# sampai REACT_APP_BACKEND_URL diarahkan ke backend yang di-host terpisah (lihat render.yaml).
# Sekali saja: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy frontend ke GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --legacy-peer-deps
      - name: Build
        env:
          CI: 'false'
          PUBLIC_URL: /${{ github.event.repository.name }}
          REACT_APP_BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          npm run build
          cp build/index.html build/404.html   # fallback SPA untuk tautan langsung ke /CORTEXIA/progress dll.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cortexia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cortexia_db
      POSTGRES_USER: cortexia_user
      POSTGRES_PASSWORD: cortexia_password_change_in_production
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds
    networks:
      - cortexia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexia_user -d cortexia_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB (for analytics and logs)
  mongodb:
    image: mongo:6
    container_name: cortexia-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: cortexia_admin
      MONGO_INITDB_ROOT_PASSWORD: cortexia_mongo_password_change_in_production
      MONGO_INITDB_DATABASE: cortexia_analytics
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - cortexia-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for caching and session management)
  redis:
    image: redis:7-alpine
    container_name: cortexia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cortexia-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Backend API (Node.js/Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortexia-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://cortexia_user:cortexia_password_change_in_production@postgres:5432/cortexia_db
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://cortexia_admin:cortexia_mongo_password_change_in_production@mongodb:27017/cortexia_analytics
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - cortexia-network
    command: npm run dev

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cortexia-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_WS_URL: ws://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - cortexia-network
    command: npm start
    stdin_open: true
    tty: true

  # AI Services (Python/FastAPI) - optional separate service
  ai-service:
    build:
      context: ./ai-models
      dockerfile: Dockerfile
    container_name: cortexia-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-models/.env
    environment:
      PYTHON_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql://cortexia_user:cortexia_password_change_in_production@postgres:5432/cortexia_db
    ports:
      - "8000:8000"
    volumes:
      - ./ai-models:/app
      - ai_models_data:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cortexia-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # PgAdmin (Database Management UI) - Development only
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cortexia-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cortexia.local
      PGADMIN_DEFAULT_PASSWORD: admin_password_change_in_production
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - cortexia-network
    profiles:
      - dev

  # Nginx (Reverse Proxy) - Production
  nginx:
    image: nginx:alpine
    container_name: cortexia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cortexia-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  uploads_data:
    driver: local
  ai_models_data:
    driver: local

networks:
  cortexia-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
